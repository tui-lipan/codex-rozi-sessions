[extension]
id = "codex-rozi-sessions"
title = "Codex threads"
description = "One Activity row per Codex thread loaded in its background server, grouped by worktree; selecting a row switches Codex to it"
version = "0.4.2"
api = 1
min_rozi = "0.0.36"
homepage = "https://github.com/tui-lipan/codex-rozi-sessions"
screenshots = ["docs/screenshot.webp"]

# Defaults. Override them in [extensions.codex-rozi-sessions] in config.toml.
[settings]
# The Codex executable.
codex = "codex"
# Seconds between polls of Codex's background server.
poll_seconds = 2
# "all" lists every loaded thread. "cwd" lists only threads working in or below the directory the
# pane is in, for when several panes each run Codex for a different project.
scope = "all"
# Selecting a row switches Codex to that thread by typing `/resume` into its empty prompt.
# false only lists threads and never types into Codex.
switching = true

[[services]]
name = "watch"
exec = ["python3", "./bin/codex_sessions.py"]
# Beside each session's Codex background server, which a client on another machine cannot reach.
placement = "each-host"
restart = "on-failure"
